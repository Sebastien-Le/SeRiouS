id: data_start
title: 'Data: the starting point'
section: data
x: 0.0
'y': 0.0
objective: Load and inspect the questionnaire used throughout the capsule.
text: |-
  This capsule follows a single dataset: a food questionnaire with quantitative variables, qualitative variables and free-text comments.

  The aim is to move progressively from explicit statistical outputs to structured prompts, and then to latent classes and textual interpretation.
code: |2

  data_env <- new.env(parent = emptyenv())

  utils::data(
    "questionnaire_alimentaire_typologie_textes",
    package = "SeRiouS",
    envir = data_env
  )

  if (!exists("questionnaire_alimentaire_typologie_textes", envir = data_env)) {
    stop(
      "Dataset questionnaire_alimentaire_typologie_textes was not found in SeRiouS.",
      call. = FALSE
    )
  }

  questionnaire <- get(
    "questionnaire_alimentaire_typologie_textes",
    envir = data_env
  )

  variables_qualitatives <- c(
    "type_produit",
    "budget_contraint",
    "sexe",
    "age_classe",
    "lieu_achat",
    "profil_alim"
  )

  variables_qualitatives <- intersect(
    variables_qualitatives,
    names(questionnaire)
  )

  questionnaire[variables_qualitatives] <- lapply(
    questionnaire[variables_qualitatives],
    factor
  )

  if ("commentaire" %in% names(questionnaire)) {
    questionnaire$commentaire <- as.character(questionnaire$commentaire)
  }

  cat("Questionnaire loaded.\n")
  cat("Rows:", nrow(questionnaire), "\n")
  cat("Columns:", ncol(questionnaire), "\n")

  str(questionnaire)
outputs: console
expected_output: The questionnaire is loaded and its structure is displayed.
